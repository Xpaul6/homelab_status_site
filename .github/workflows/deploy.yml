name: Build check and deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker Compose
      uses: docker/setup-compose-action@v2
      with:
        version: latest

    - name: Build Docker Compose
      run: docker compose build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Pull and rebuild containers
        run: |
          ssh -v ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.WORK_DIR }} &&
            git fetch && git pull &&
            docker build ./frontend -t dashboard-frontend &&
            docker build ./backend -t dashboard-backend &&
            minikube image load dashboard-frontend &&
            minikube image load dashboard-backend &&
            kubectl apply -f manifests/general.yaml &&
            kubectl rollout restart deployment/dashboard-backend -n dashboard-ns &&
            kubectl rollout restart deployment/dashboard-frontend -n dashboard-ns
          "

      - name: Cleanup
        run: rm -rf ~/.ssh/
