services:
  dash-frontend:
    build: ./frontend_new
    ports:
      - "5555:5555" # Host:Container
    environment:
      - BACKEND_URL=http://dash-backend:8080
    depends_on:
      - dash-backend
    networks:
      - app-network

  dash-backend:
    build: ./backend_new
    ports:
      - "8080:8080" # Host:Container
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
